<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>המתכונים של אמא</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FAF6EC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="המתכונים של אמא">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body style="margin:0">
<div id="rf-app" dir="rtl"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.3.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.3.0/firebase-firestore-compat.min.js"></script>

<style>
  #rf-app {
    --paper: #FBF7ED; --paper-2: #F1E9D8; --ink: #2B2118; --ink-soft: #7A6E5C;
    --line: #E5DBC4; --forest: #3E6350; --forest-soft: #E3EFE0; --terracotta: #D2653A;
    --olive: #3E6350; --olive-soft: #E3EFE0; --mustard: #C98A2C; --brick: #B04A3A;
    font-family: 'Rubik', sans-serif;
    background: var(--paper); color: var(--ink);
    min-height: 100vh; padding: 20px 16px 80px; box-sizing: border-box;
  }
  @import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Rubik:wght@400;500;600;700&display=swap');
  #rf-app * { box-sizing: border-box; }
  .rf-title { font-family: 'Frank Ruhl Libre', serif; font-weight: 700; }
  .rf-card { background: #fff; border: 1px solid var(--line); border-radius: 18px; }
  .rf-btn {
    border: 1px solid var(--forest); background: var(--forest); color: #fff; border-radius: 24px;
    padding: 10px 18px; font-family: 'Rubik', sans-serif; font-size: 14px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .rf-btn:active { transform: translateY(1px); }
  .rf-btn-outline { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .rf-input {
    width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 24px;
    padding: 12px 14px; font-family: 'Rubik', sans-serif; font-size: 15px; color: var(--ink);
  }
  .rf-input:focus, .rf-btn:focus, .rf-chip:focus { outline: 2px solid var(--forest); outline-offset: 1px; }
  .rf-chip {
    border: 1px solid transparent; border-radius: 24px; padding: 8px 15px; font-size: 13px; font-weight: 600;
    cursor: pointer; background: var(--paper-2); color: var(--ink-soft); display: inline-flex; align-items: center; gap: 6px;
  }
  .rf-chip.on { border-color: currentColor; box-shadow: inset 0 0 0 1px currentColor; }
  .rf-catrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .rf-catchip {
    border: 1px solid transparent; border-radius: 16px; padding: 8px 6px; font-size: 13px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .rf-catchip.on { border-color: currentColor; box-shadow: inset 0 0 0 1px currentColor; }
  .rf-badge { font-size: 12px; padding: 3px 9px; border-radius: 20px; font-weight: 600; display: inline-block; }
  .rf-suggest {
    position: absolute; z-index: 5; top: calc(100% + 4px); right: 0; left: 0;
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 4px 10px rgba(43,33,24,0.12); overflow: hidden;
  }
  .rf-suggest button {
    display: block; width: 100%; text-align: right; padding: 9px 12px; font-size: 14px;
    background: none; border: none; cursor: pointer; color: var(--ink); font-family: 'Rubik', sans-serif;
  }
  .rf-suggest button:hover { background: var(--paper-2); }

  .rf-list { display: flex; flex-direction: column; gap: 18px; }
  .rf-bigcard {
    cursor: pointer; overflow: hidden; box-shadow: 0 2px 10px rgba(43,33,24,0.06);
  }
  .rf-bigcard-imgwrap { position: relative; }
  .rf-bigcard-img { width: 100%; height: 210px; object-fit: cover; display: block; background: var(--paper-2); }
  .rf-bigcard-placeholder {
    width: 100%; height: 210px; background: var(--paper-2); display: flex; align-items: center; justify-content: center; font-size: 40px;
  }
  .rf-fav {
    position: absolute; bottom: 10px; right: 10px; background: rgba(255,255,255,.92); border-radius: 20px;
    padding: 5px 11px; font-size: 14px; display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,.15);
  }
  .rf-bigcard-body { padding: 16px; }
  .rf-bigcard-meta { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-soft); margin: 10px 0; flex-wrap: wrap; }
  .rf-bigcard-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .rf-bigcard-desc { font-size: 13px; color: var(--ink-soft); line-height: 1.6; margin: 0 0 12px; }
  .rf-details-link {
    display: inline-flex; align-items: center; gap: 4px; background: var(--forest-soft); color: var(--forest);
    border: none; border-radius: 20px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
  }

  .rf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 12px; }
  .rf-tile { display: flex; flex-direction: column; cursor: pointer; overflow: hidden; }
  .rf-tile-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 4px 4px 0 0; display: block; background: var(--paper-2); }
  .rf-tile-placeholder { width: 100%; aspect-ratio: 1/1; border-radius: 4px 4px 0 0; background: var(--paper-2); display: flex; align-items: center; justify-content: center; }
  .rf-tile-body { padding: 10px; }
  .rf-fab {
    position: fixed; bottom: 22px; left: 20px; border-radius: 50%; width: 56px; height: 56px;
    padding: 0; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(62,99,80,0.45); font-size: 28px; line-height: 1;
  }
  .rf-label { font-size: 13px; color: var(--ink-soft); display: block; margin-bottom: 6px; }
  .rf-status { font-size: 12px; margin-top: 10px; }
  .rf-signoff { text-align: center; color: var(--ink-soft); font-size: 13px; margin-top: 24px; opacity: .7; }
  .rf-tabs { display: flex; gap: 4px; margin: 16px 0; background: var(--paper-2); border-radius: 24px; padding: 4px; }
  .rf-tab {
    flex: 1; text-align: center; padding: 9px 3px; border-radius: 20px; font-size: 12.5px; font-weight: 600;
    cursor: pointer; color: var(--ink-soft); border: none; background: transparent; display: inline-flex;
    align-items: center; justify-content: center; gap: 3px; white-space: nowrap; overflow: hidden;
  }
  .rf-tab.on { background: var(--forest); color: #fff; }
  .rf-shop-row {
    display: flex; align-items: center; gap: 10px; padding: 11px 4px; border-bottom: 1px solid var(--line);
  }
  .rf-shop-check {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex-shrink: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff;
  }
  .rf-shop-check.on { background: var(--forest); border-color: var(--forest); }
  .rf-shop-name { flex: 1; font-size: 15px; }
  .rf-shop-name.done { text-decoration: line-through; color: var(--ink-soft); }
</style>

<script>
  var CATEGORY_META = {
    "בשר": { icon: "🥩", bg: "#FBE7C9", fg: "#A5691F" },
    "דג": { icon: "🐟", bg: "#DCEBF2", fg: "#3E7690" },
    "צמחוני": { icon: "🌿", bg: "#E3EFE0", fg: "#3E6350" },
    "קינוח": { icon: "🍰", bg: "#FBE1EC", fg: "#B85C8A" }
  };
</script>

<script>
(function () {
  var firebaseConfig = {
    apiKey: "AIzaSyAbgRq6F-wyEd2DiH9V1uGixccVlDCDFbo",
    authDomain: "family-recepies.firebaseapp.com",
    projectId: "family-recepies",
    storageBucket: "family-recepies.firebasestorage.app",
    messagingSenderId: "784734318905",
    appId: "1:784734318905:web:20fd4b02584e3c7d5c78e8"
  };

  var TIME_OPTIONS = [
    { key: "quick", label: "מהיר", hint: "עד 20 דק׳", color: "#6E7F4F" },
    { key: "medium", label: "בינוני", hint: "20–45 דק׳", color: "#C98A2C" },
    { key: "long", label: "ארוך", hint: "45 דק׳ ומעלה", color: "#9A4B3A" }
  ];
  var MAIN_INGREDIENT_OPTIONS = ["בשר", "דג", "צמחוני", "קינוח"];
  var OLD_MEAT_CATS = ["בשר טחון", "עוף טחון"]; // migrated automatically into "בשר"
  function timeMeta(key) {
    for (var i = 0; i < TIME_OPTIONS.length; i++) if (TIME_OPTIONS[i].key === key) return TIME_OPTIONS[i];
    return TIME_OPTIONS[0];
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var root = document.getElementById("rf-app");
  var app, db;
  var connStatus = "connecting"; // connecting | ok | error
  var connErrorMsg = "";

  var state = {
    tab: "recipes", // recipes | shopping | freezer
    recipes: [],
    loading: true,
    view: "list", // list | detail | form
    activeId: null,
    query: "",
    activeCategories: [],
    freezerOnly: false,
    formIngredients: [],
    formImage: "",
    formImgBusy: false,
    formError: "",
    shoppingItems: [],
    shoppingLoading: true,
    freezerItems: [],
    freezerLoading: true,
    freezerFormOpen: false
  };

  var FREEZER_CATS = [
    { key: "meat", label: "בשר", icon: "🥩" },
    { key: "fish", label: "דג", icon: "🐟" }
  ];
  var FREEZER_UNITS = [
    { key: "kg", label: 'ק"ג' },
    { key: "units", label: "יחידות" }
  ];

  // An ingredient entry is either a plain string, or an object { or: [...] }
  // representing interchangeable alternatives ("בשר טחון או עוף טחון").
  // NOTE: this must NOT be a bare array — Firestore rejects arrays that
  // directly contain other arrays ("nested arrays are not supported"),
  // which silently threw and blocked saving before this fix.
  function isOrGroup(entry) { return entry && typeof entry === "object" && Array.isArray(entry.or); }
  function ingredientNames(entry) { return isOrGroup(entry) ? entry.or : [entry]; }
  function ingredientLabel(entry) { return isOrGroup(entry) ? entry.or.join(" או ") : entry; }

  function allIngredients() {
    var set = {};
    state.recipes.forEach(function (r) {
      (r.ingredients || []).forEach(function (entry) {
        ingredientNames(entry).forEach(function (n) { set[n] = true; });
      });
    });
    return Object.keys(set).sort(function (a, b) { return a.localeCompare(b, "he"); });
  }

  var FREEZER_TRACKED_CATS = ["בשר", "דג"];

  function filteredRecipes() {
    var tokens = state.query.split(",").map(function (t) { return t.trim(); }).filter(Boolean);
    return state.recipes.filter(function (r) {
      if (state.activeCategories.length > 0 && state.activeCategories.indexOf(r.mainIngredient) === -1) return false;
      if (state.freezerOnly && FREEZER_TRACKED_CATS.indexOf(r.mainIngredient) !== -1 && !hasFreezerStock(r.mainIngredient)) return false;
      if (tokens.length === 0) return true;
      return tokens.every(function (tok) {
        return (r.ingredients || []).some(function (entry) {
          return ingredientNames(entry).some(function (n) { return n.indexOf(tok) !== -1; });
        }) || (r.name || "").indexOf(tok) !== -1;
      });
    });
  }

  function resizeImage(file, maxWidth, quality) {
    maxWidth = maxWidth || 480; quality = quality || 0.72;
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, maxWidth / img.width);
          var canvas = document.createElement("canvas");
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ---------- Firebase init ----------
  history.replaceState({ rfView: "list", rfId: null }, "");
  var sessionOrder = null; // ids in shuffled order, fixed for this page load

  function applySessionOrder(list) {
    if (sessionOrder === null) {
      // Fisher-Yates shuffle, once per page load
      for (var i = list.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
      }
      sessionOrder = list.map(function (r) { return r.id; });
      return list;
    }
    var byId = {};
    list.forEach(function (r) { byId[r.id] = r; });
    var ordered = [];
    sessionOrder.forEach(function (id) { if (byId[id]) { ordered.push(byId[id]); delete byId[id]; } });
    // any new recipes not yet in the session order get appended (and remembered)
    Object.keys(byId).forEach(function (id) { ordered.push(byId[id]); sessionOrder.push(id); });
    return ordered;
  }

  try {
    app = firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    db.collection("recipes").onSnapshot(
      function (snap) {
        var list = [];
        snap.forEach(function (doc) { list.push(Object.assign({ id: doc.id }, doc.data())); });
        list.forEach(function (r) {
          if (OLD_MEAT_CATS.indexOf(r.mainIngredient) !== -1) {
            r.mainIngredient = "בשר"; // reflect immediately in the UI
            db.collection("recipes").doc(r.id).update({ mainIngredient: "בשר" }).catch(function () {});
          }
        });
        state.recipes = applySessionOrder(list);
        state.loading = false;
        connStatus = "ok";
        render();
      },
      function (err) {
        connStatus = "error";
        connErrorMsg = err && err.message ? err.message : String(err);
        state.loading = false;
        render();
      }
    );
    db.collection("shopping").onSnapshot(
      function (snap) {
        var items = [];
        snap.forEach(function (doc) { items.push(Object.assign({ id: doc.id }, doc.data())); });
        items.sort(function (a, b) {
          if (!!a.checked !== !!b.checked) return a.checked ? 1 : -1;
          return (a.name || "").localeCompare(b.name || "", "he");
        });
        state.shoppingItems = items;
        state.shoppingLoading = false;
        render();
      },
      function (err) {
        state.shoppingLoading = false;
        render();
      }
    );
    db.collection("freezer").onSnapshot(
      function (snap) {
        var items = [];
        snap.forEach(function (doc) { items.push(Object.assign({ id: doc.id }, doc.data())); });
        items.sort(function (a, b) { return (a.name || "").localeCompare(b.name || "", "he"); });
        state.freezerItems = items;
        state.freezerLoading = false;
        render();
      },
      function (err) {
        state.freezerLoading = false;
        render();
      }
    );
  } catch (err) {
    connStatus = "error";
    connErrorMsg = err && err.message ? err.message : String(err);
    state.loading = false;
  }

  // ---------- Actions ----------
  function openDetail(id) {
    state.activeId = id; state.view = "detail";
    history.pushState({ rfView: "detail", rfId: id }, "");
    render();
  }
  function openNewForm() {
    state.activeId = null; state.view = "form";
    state.formIngredients = []; state.formImage = ""; state.formError = "";
    history.pushState({ rfView: "form", rfId: null }, "");
    render();
  }
  function openEditForm(id) {
    var r = state.recipes.find(function (x) { return x.id === id; });
    state.activeId = id; state.view = "form";
    state.formIngredients = (r && r.ingredients) ? r.ingredients.slice() : [];
    state.formImage = (r && r.image) || "";
    state.formError = "";
    history.pushState({ rfView: "form", rfId: id }, "");
    render();
  }
  // "Back" always means: go back one step in our own navigation history,
  // so the phone's physical/browser back button stays inside the app
  // (list -> detail -> form) instead of leaving the site.
  function backToList() { history.back(); }

  window.addEventListener("popstate", function (e) {
    var s = e.state || { rfView: "list", rfId: null };
    if (s.rfView === "form") {
      var id = s.rfId;
      var r = id ? state.recipes.find(function (x) { return x.id === id; }) : null;
      state.activeId = id;
      state.view = "form";
      state.formIngredients = (r && r.ingredients) ? r.ingredients.slice() : [];
      state.formImage = (r && r.image) || "";
      state.formError = "";
    } else if (s.rfView === "detail") {
      state.activeId = s.rfId;
      state.view = "detail";
    } else {
      state.activeId = null;
      state.view = "list";
    }
    render();
  });

  function deleteRecipe(id) {
    db.collection("recipes").doc(id).delete().catch(function (err) {
      alert("מחיקה נכשלה: " + (err && err.message ? err.message : err));
    });
    backToList();
  }

  function saveRecipeFromForm() {
    var nameEl = document.getElementById("rf-f-name");
    var timeEl = root.querySelector('input[name="rf-time"]:checked');
    var mainEl = root.querySelector('input[name="rf-main"]:checked');
    var linkEl = document.getElementById("rf-f-link");
    var instrEl = document.getElementById("rf-f-instructions");
    var ingInput = document.getElementById("rf-ing-input");

    // Auto-commit any ingredient text left in the input (comma-separated or not)
    if (ingInput && ingInput.value.trim()) {
      ingInput.value.split(",").forEach(function (p) {
        var v = p.trim();
        var exists = state.formIngredients.some(function (entry) { return ingredientNames(entry).indexOf(v) !== -1; });
        if (v && !exists) state.formIngredients.push(v);
      });
      ingInput.value = "";
    }

    var name = nameEl.value.trim();
    if (!name || state.formIngredients.length === 0) {
      showFormError("צריך שם מנה ולפחות מרכיב אחד");
      return;
    }

    var payload = {
      name: name,
      ingredients: state.formIngredients,
      time: timeEl ? timeEl.value : "quick",
      mainIngredient: mainEl ? mainEl.value : "",
      link: linkEl.value.trim(),
      instructions: instrEl.value.trim(),
      image: state.formImage || ""
    };

    var ref = state.activeId ? db.collection("recipes").doc(state.activeId) : db.collection("recipes").doc();
    ref.set(payload)
      .then(function () { backToList(); })
      .catch(function (err) {
        showFormError("השמירה נכשלה: " + (err && err.message ? err.message : err));
      });
  }

  function showFormError(msg) {
    state.formError = msg;
    var box = document.getElementById("rf-form-error");
    if (box) {
      box.innerHTML = msg ? '<p class="rf-status" style="color:var(--brick)">' + esc(msg) + '</p>' : "";
    } else {
      render();
    }
  }

  function toggleCategory(cat) {
    var i = state.activeCategories.indexOf(cat);
    if (i === -1) state.activeCategories.push(cat); else state.activeCategories.splice(i, 1);
    render();
  }

  // ---------- Render: pieces ----------
  function renderIngredientChips() {
    return state.formIngredients.map(function (ing, idx) {
      return '<span class="rf-chip on" data-idx="' + idx + '">' +
        (idx > 0 ? '<span data-move-up-idx="' + idx + '" style="cursor:pointer;padding:0 2px" title="הזזה למעלה">⬆</span>' : '') +
        esc(ingredientLabel(ing)) +
        ' <span data-remove-idx="' + idx + '" style="cursor:pointer">✕</span></span>';
    }).join("");
  }

  function renderRecipeCard(r) {
    var tm = timeMeta(r.time);
    var img = r.image
      ? '<img src="' + r.image + '" class="rf-bigcard-img" alt="" />'
      : '<div class="rf-bigcard-placeholder">🍽</div>';
    var cm = CATEGORY_META[r.mainIngredient];
    var teaser = r.instructions ? r.instructions.slice(0, 90) + (r.instructions.length > 90 ? "…" : "") : r.ingredients.slice(0, 5).map(ingredientLabel).join(" · ");
    return (
      '<div class="rf-card rf-bigcard" data-open="' + r.id + '">' +
      '<div class="rf-bigcard-imgwrap">' + img +
      '<span class="rf-fav" data-fav="' + r.id + '">' + (r.favorite ? "❤️" : "🤍") + '</span>' +
      '</div>' +
      '<div class="rf-bigcard-body">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">' +
      '<h3 class="rf-title" style="margin:0;font-size:19px">' + esc(r.name) + '</h3>' +
      '</div>' +
      '<div style="margin-top:8px">' +
      '<span class="rf-badge" style="background:' + tm.color + '22;color:' + tm.color + '">⚡ ' + tm.label + '</span>' +
      (cm ? ' <span class="rf-badge" style="background:' + cm.bg + ';color:' + cm.fg + '">' + cm.icon + ' ' + esc(r.mainIngredient) + '</span>' : '') +
      '</div>' +
      '<div class="rf-bigcard-meta">' +
      '<span>🕐 הכנה: ' + tm.hint + '</span>' +
      '<span>|</span>' +
      '<span>🍴 ' + r.ingredients.length + ' מרכיבים</span>' +
      (r.link ? '<span>|</span><span>🔗 יש קישור</span>' : '') +
      '</div>' +
      (teaser ? '<p class="rf-bigcard-desc">' + esc(teaser) + '</p>' : '') +
      '<button type="button" class="rf-details-link" data-open="' + r.id + '">לפרטים מלאים ←</button>' +
      '</div></div>'
    );
  }

  function toggleFavorite(id) {
    var r = state.recipes.find(function (x) { return x.id === id; });
    if (!r) return;
    db.collection("recipes").doc(id).update({ favorite: !r.favorite }).catch(function () {});
  }

  // ---------- Shopping list ----------
  var SHOP_SECTIONS = [
    { key: "super", label: "סופר", icon: "🛒" },
    { key: "meat", label: "קצבייה", icon: "🥩" },
    { key: "fish", label: "דגים", icon: "🐟" }
  ];

  // If the item's name matches a tracked freezer item exactly, file it
  // under that freezer item's section (קצבייה/דגים); otherwise it's a
  // regular supermarket item.
  function guessShoppingCategory(name) {
    var match = state.freezerItems.find(function (i) { return i.name === name; });
    return match ? match.category : "super";
  }

  function addShoppingItems(items) {
    var existing = state.shoppingItems.map(function (i) { return (i.name || "").trim(); });
    var batch = db.batch();
    var any = false;
    items.forEach(function (raw) {
      var name, category;
      if (raw && typeof raw === "object") { name = (raw.name || "").trim(); category = raw.category; }
      else { name = String(raw).trim(); category = null; }
      if (!name || existing.indexOf(name) !== -1) return;
      existing.push(name);
      var ref = db.collection("shopping").doc();
      batch.set(ref, { name: name, checked: false, category: category || guessShoppingCategory(name) });
      any = true;
    });
    if (any) batch.commit().catch(function () {});
  }

  function toggleShoppingItem(id) {
    var item = state.shoppingItems.find(function (x) { return x.id === id; });
    if (!item) return;
    db.collection("shopping").doc(id).update({ checked: !item.checked }).catch(function () {});
  }

  function deleteShoppingItem(id) {
    db.collection("shopping").doc(id).delete().catch(function () {});
  }

  function clearCheckedShoppingItems() {
    var batch = db.batch();
    state.shoppingItems.forEach(function (i) { if (i.checked) batch.delete(db.collection("shopping").doc(i.id)); });
    batch.commit().catch(function () {});
  }

  function clearAllShoppingItems() {
    var batch = db.batch();
    state.shoppingItems.forEach(function (i) { batch.delete(db.collection("shopping").doc(i.id)); });
    batch.commit().catch(function () {});
  }

  // ---------- Freezer inventory ----------
  function addFreezerItem(data) {
    db.collection("freezer").add({
      name: data.name,
      category: data.category,
      unit: data.unit,
      currentQty: data.currentQty,
      usualQty: data.usualQty
    }).catch(function () {});
  }

  function updateFreezerQty(id, field, value) {
    var patch = {};
    patch[field] = value;
    db.collection("freezer").doc(id).update(patch).catch(function () {});
  }

  function deleteFreezerItem(id) {
    db.collection("freezer").doc(id).delete().catch(function () {});
  }

  function freezerUnitLabel(unitKey) {
    var u = FREEZER_UNITS.find(function (x) { return x.key === unitKey; });
    return u ? u.label : unitKey;
  }

  function missingAmount(item) {
    var m = (item.usualQty || 0) - (item.currentQty || 0);
    return m > 0 ? m : 0;
  }

  function formatQty(n) {
    // trims trailing .0 but keeps e.g. 1.5
    return (Math.round(n * 100) / 100).toString();
  }

  // Used by the "show what's in the freezer" recipe filter: "בשר" is in
  // stock if any freezer item in the meat section has quantity > 0, and
  // likewise "דג" against the fish section.
  var CATEGORY_TO_FREEZER_SECTION = { "בשר": "meat", "דג": "fish" };
  function hasFreezerStock(categoryName) {
    var section = CATEGORY_TO_FREEZER_SECTION[categoryName];
    if (!section) return false;
    return state.freezerItems.some(function (i) { return i.category === section && (i.currentQty || 0) > 0; });
  }

  function renderList() {
    var catsHtml = MAIN_INGREDIENT_OPTIONS.map(function (c) {
      var cm = CATEGORY_META[c];
      var on = state.activeCategories.indexOf(c) !== -1;
      return '<button type="button" class="rf-catchip ' + (on ? "on" : "") + '" style="background:' + cm.bg + ';color:' + cm.fg + '" data-cat="' + esc(c) + '">' + cm.icon + ' ' + c + '</button>';
    }).join("");

    return (
      '<div style="position:relative">' +
      '<span style="position:absolute;right:14px;top:14px;color:var(--ink-soft)">🔍</span>' +
      '<input id="rf-search" class="rf-input" style="padding-right:38px" placeholder="חיפוש לפי רכיב או שם מנה" value="' + esc(state.query) + '" />' +
      '<div id="rf-search-suggest"></div>' +
      '</div>' +
      '<div class="rf-catrow" style="margin:14px 0 10px">' + catsHtml + '</div>' +
      '<label class="rf-chip ' + (state.freezerOnly ? "on" : "") + '" style="background:var(--forest-soft);color:var(--forest);margin-bottom:16px">' +
      '<input type="checkbox" id="rf-freezer-only" ' + (state.freezerOnly ? "checked" : "") + ' style="display:none">' +
      '🧊 רק מה שיש במקפיא</label>' +
      '<button type="button" id="rf-random" class="rf-details-link" style="width:100%;justify-content:center;margin-bottom:16px;padding:12px">🎲 הפתיעו אותי — מנה רנדומלית</button>' +
      '<div id="rf-results">' + buildResultsHtml() + '</div>' +
      '<button type="button" id="rf-fab" class="rf-btn rf-fab" aria-label="הוספת מתכון">+</button>' +
      '<p class="rf-signoff">בתיאבון 🌿</p>'
    );
  }

  function buildResultsHtml() {
    var recipes = filteredRecipes();
    return recipes.length
      ? '<div class="rf-list">' + recipes.map(renderRecipeCard).join("") + '</div>'
      : '<div class="rf-card" style="padding:20px;text-align:center;color:var(--ink-soft)">לא נמצאו מתכונים תואמים.</div>';
  }

  function updateResults() {
    var box = document.getElementById("rf-results");
    if (!box) return;
    box.innerHTML = buildResultsHtml();
    wireResultCards();
  }

  function wireResultCards() {
    var box = document.getElementById("rf-results");
    if (!box) return;
    box.querySelectorAll("[data-open]").forEach(function (card) {
      card.addEventListener("click", function () { openDetail(card.getAttribute("data-open")); });
    });
    box.querySelectorAll("[data-fav]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        toggleFavorite(el.getAttribute("data-fav"));
      });
    });
  }

  function openRandomRecipe() {
    var pool = filteredRecipes();
    if (pool.length === 0) pool = state.recipes;
    if (pool.length === 0) return;
    var pick = pool[Math.floor(Math.random() * pool.length)];
    openDetail(pick.id);
  }

  function renderDetail() {
    var r = state.recipes.find(function (x) { return x.id === state.activeId; });
    if (!r) { backToList(); return ""; }
    var tm = timeMeta(r.time);
    return (
      '<button type="button" id="rf-back" class="rf-btn rf-btn-outline" style="margin-bottom:14px">→ חזרה לרשימה</button>' +
      '<div class="rf-card" style="padding:18px">' +
      (r.image ? '<img src="' + r.image + '" style="width:100%;max-height:220px;object-fit:cover;border-radius:4px;margin-bottom:14px" alt="" />' : '') +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">' +
      '<h2 class="rf-title" style="font-size:22px;margin:0">' + esc(r.name) + '</h2>' +
      '<span class="rf-badge" style="background:' + tm.color + '22;color:' + tm.color + ';white-space:nowrap">' + tm.label + ' · ' + tm.hint + '</span>' +
      '</div>' +
      (r.mainIngredient && CATEGORY_META[r.mainIngredient] ? '<span class="rf-badge" style="background:' + CATEGORY_META[r.mainIngredient].bg + ';color:' + CATEGORY_META[r.mainIngredient].fg + ';margin-top:10px">' + CATEGORY_META[r.mainIngredient].icon + ' ' + esc(r.mainIngredient) + '</span>' : '') +
      '<h4 style="font-size:13px;color:var(--ink-soft);margin:16px 0 6px;font-weight:500">מרכיבים</h4>' +
      '<ul style="margin:0;padding-right:18px;font-size:14px;line-height:1.9">' +
      (r.ingredients || []).map(function (i) { return '<li>' + esc(ingredientLabel(i)) + '</li>'; }).join("") +
      '</ul>' +
      (r.instructions ? '<h4 style="font-size:13px;color:var(--ink-soft);margin:16px 0 6px;font-weight:500">אופן ההכנה</h4><p style="margin:0;font-size:14px;line-height:1.8;white-space:pre-wrap">' + esc(r.instructions) + '</p>' : '') +
      (r.link ? '<a href="' + esc(r.link) + '" target="_blank" rel="noreferrer" class="rf-btn rf-btn-outline" style="margin-top:16px;text-decoration:none;display:inline-flex">🔗 פתיחת המתכון המקורי</a>' : '') +
      '<button type="button" id="rf-add-shop" class="rf-details-link" style="margin-top:12px;width:100%;justify-content:center;padding:11px">🛒 הוספה לרשימת הקניות</button>' +
      '<div id="rf-shop-picker"></div>' +
      '<div style="display:flex;gap:8px;margin-top:20px;border-top:1px solid var(--line);padding-top:14px">' +
      '<button type="button" id="rf-edit" class="rf-btn rf-btn-outline">✏️ עריכה</button>' +
      '<button type="button" id="rf-delete" class="rf-btn rf-btn-outline">🗑 מחיקה</button>' +
      '</div></div>'
    );
  }

  function renderForm() {
    var r = state.activeId ? state.recipes.find(function (x) { return x.id === state.activeId; }) : null;
    var timeChips = TIME_OPTIONS.map(function (t) {
      var checked = (r ? r.time === t.key : t.key === "quick");
      return '<label class="rf-chip ' + (checked ? "on" : "") + '"><input type="radio" name="rf-time" value="' + t.key + '" ' + (checked ? "checked" : "") + ' style="display:none">' + t.label + '</label>';
    }).join("");
    var mainChips = MAIN_INGREDIENT_OPTIONS.map(function (c) {
      var checked = r && r.mainIngredient === c;
      var cm = CATEGORY_META[c];
      return '<label class="rf-chip ' + (checked ? "on" : "") + '" style="background:' + cm.bg + ';color:' + cm.fg + '"><input type="radio" name="rf-main" value="' + c + '" ' + (checked ? "checked" : "") + ' style="display:none">' + cm.icon + ' ' + c + '</label>';
    }).join("");

    return (
      '<div class="rf-card" style="padding:18px">' +
      '<h2 class="rf-title" style="font-size:20px;margin:0 0 16px">' + (r ? "עריכת מתכון" : "מתכון חדש") + '</h2>' +
      '<div id="rf-form-error">' + (state.formError ? '<p class="rf-status" style="color:var(--brick)">' + esc(state.formError) + '</p>' : '') + '</div>' +

      '<span class="rf-label">תמונה</span>' +
      '<div id="rf-img-wrap" style="margin-bottom:16px"></div>' +

      '<span class="rf-label">שם המנה</span>' +
      '<input id="rf-f-name" class="rf-input" style="margin-bottom:14px" placeholder="למשל: עוף בתנור עם תפוחי אדמה" value="' + (r ? esc(r.name) : "") + '" />' +

      '<span class="rf-label">מרכיבים</span>' +
      '<div id="rf-ing-chips" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">' + renderIngredientChips() + '</div>' +
      '<div style="position:relative;margin-bottom:6px">' +
      '<input id="rf-ing-input" class="rf-input" placeholder="הקלידו מרכיבים מופרדים בפסיק" />' +
      '<div id="rf-ing-suggest"></div>' +
      '</div>' +
      '<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;cursor:pointer">' +
      '<input type="checkbox" id="rf-ing-or" style="width:16px;height:16px">' +
      '🔀 המרכיב הבא הוא חלופה ("או") למרכיב האחרון, לא מרכיב נוסף' +
      '</label>' +

      '<span class="rf-label">זמן הכנה</span>' +
      '<div style="display:flex;gap:8px;margin-bottom:14px">' + timeChips + '</div>' +

      '<span class="rf-label">רכיב עיקרי</span>' +
      '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">' + mainChips + '</div>' +

      '<span class="rf-label">אופן ההכנה (לא חובה)</span>' +
      '<textarea id="rf-f-instructions" class="rf-input" rows="4" style="margin-bottom:14px;resize:vertical" placeholder="שלבי ההכנה, בחופשיות">' + (r ? esc(r.instructions || "") : "") + '</textarea>' +

      '<span class="rf-label">קישור למתכון (לא חובה)</span>' +
      '<input id="rf-f-link" class="rf-input" style="margin-bottom:18px" placeholder="https://..." value="' + (r ? esc(r.link || "") : "") + '" />' +

      '<div style="display:flex;gap:8px">' +
      '<button type="button" id="rf-save" class="rf-btn">שמירה</button>' +
      '<button type="button" id="rf-cancel" class="rf-btn rf-btn-outline">✕ ביטול</button>' +
      '</div></div>'
    );
  }

  function renderImageWrap() {
    var wrap = document.getElementById("rf-img-wrap");
    if (!wrap) return;
    if (state.formImage) {
      wrap.innerHTML =
        '<div style="position:relative;width:120px">' +
        '<img src="' + state.formImage + '" style="width:120px;height:120px;object-fit:cover;border-radius:4px" alt="" />' +
        '<button type="button" id="rf-img-remove" class="rf-btn rf-btn-outline" style="position:absolute;top:4px;left:4px;padding:4px;border-radius:50%">✕</button>' +
        '</div>';
    } else {
      wrap.innerHTML =
        '<label for="rf-img-input" class="rf-btn rf-btn-outline" style="' + (state.formImgBusy ? "opacity:.6;pointer-events:none" : "") + '">📷 ' + (state.formImgBusy ? "טוען..." : "העלאת תמונה מהגלריה") + '</label>' +
        '<input id="rf-img-input" type="file" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden" />';
    }
  }

  // ---------- Master render ----------
  function renderTabs() {
    var uncheckedCount = state.shoppingItems.filter(function (i) { return !i.checked; }).length;
    return (
      '<div class="rf-tabs">' +
      '<button type="button" class="rf-tab ' + (state.tab === "recipes" ? "on" : "") + '" data-tab="recipes">🍲 מתכונים</button>' +
      '<button type="button" class="rf-tab ' + (state.tab === "shopping" ? "on" : "") + '" data-tab="shopping">🛒 קניות' +
      (uncheckedCount > 0 ? ' <span class="rf-badge" style="background:rgba(255,255,255,.25);color:inherit">' + uncheckedCount + '</span>' : '') +
      '</button>' +
      '<button type="button" class="rf-tab ' + (state.tab === "freezer" ? "on" : "") + '" data-tab="freezer">🧊 מקפיא</button>' +
      '</div>'
    );
  }

  function shoppingRowHtml(i) {
    return (
      '<div class="rf-shop-row">' +
      '<span class="rf-shop-check ' + (i.checked ? "on" : "") + '" data-shop-toggle="' + i.id + '">' + (i.checked ? "✓" : "") + '</span>' +
      '<span class="rf-shop-name ' + (i.checked ? "done" : "") + '">' + esc(i.name) + '</span>' +
      '<span data-shop-del="' + i.id + '" style="cursor:pointer;color:var(--ink-soft);padding:4px">✕</span>' +
      '</div>'
    );
  }

  function renderShopping() {
    var sectionsHtml = SHOP_SECTIONS.map(function (sec) {
      var items = state.shoppingItems.filter(function (i) { return (i.category || "super") === sec.key; });
      if (items.length === 0) return "";
      return (
        '<h4 class="rf-title" style="font-size:14px;margin:16px 0 6px">' + sec.icon + ' ' + sec.label + '</h4>' +
        '<div class="rf-card" style="padding:2px 14px">' + items.map(shoppingRowHtml).join("") + '</div>'
      );
    }).join("");

    var hasChecked = state.shoppingItems.some(function (i) { return i.checked; });
    var hasAny = state.shoppingItems.length > 0;

    return (
      '<div style="position:relative;margin-bottom:14px">' +
      '<input id="rf-shop-input" class="rf-input" placeholder="הוסיפו פריט לרשימה" />' +
      '</div>' +
      (hasAny
        ? sectionsHtml
        : '<div class="rf-card" style="padding:20px;text-align:center;color:var(--ink-soft)">הרשימה ריקה כרגע 🛒</div>') +
      '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">' +
      (hasChecked ? '<button type="button" id="rf-shop-clear" class="rf-details-link">נקה מסומנים</button>' : '') +
      (hasAny ? '<button type="button" id="rf-shop-clear-all" class="rf-btn-outline rf-btn">🗑 הסר הכל</button>' : '') +
      '</div>'
    );
  }

  function wireShopping() {
    var input = document.getElementById("rf-shop-input");
    if (input) {
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          if (input.value.trim()) { addShoppingItems(input.value.split(",")); input.value = ""; }
        }
      });
      input.addEventListener("input", function () {
        if (input.value.indexOf(",") !== -1) {
          var parts = input.value.split(",");
          var remainder = parts.pop();
          addShoppingItems(parts);
          input.value = remainder.replace(/^\s+/, "");
        }
      });
    }
    root.querySelectorAll("[data-shop-toggle]").forEach(function (el) {
      el.addEventListener("click", function () { toggleShoppingItem(el.getAttribute("data-shop-toggle")); });
    });
    root.querySelectorAll("[data-shop-del]").forEach(function (el) {
      el.addEventListener("click", function () { deleteShoppingItem(el.getAttribute("data-shop-del")); });
    });
    var clearBtn = document.getElementById("rf-shop-clear");
    if (clearBtn) clearBtn.addEventListener("click", clearCheckedShoppingItems);
    var clearAllBtn = document.getElementById("rf-shop-clear-all");
    if (clearAllBtn) clearAllBtn.addEventListener("click", function () {
      if (confirm("להסיר את כל הפריטים מרשימת הקניות?")) clearAllShoppingItems();
    });
  }

  function renderFreezer() {
    var sectionsHtml = FREEZER_CATS.map(function (cat) {
      var items = state.freezerItems.filter(function (i) { return i.category === cat.key; });
      var rows = items.map(function (i) {
        var missing = missingAmount(i);
        var unitLabel = freezerUnitLabel(i.unit);
        return (
          '<div class="rf-shop-row" style="flex-wrap:wrap">' +
          '<span style="flex:1;font-size:14px;font-weight:600;min-width:90px">' + esc(i.name) + '</span>' +
          '<span style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-soft)">' +
          'יש: <input type="number" step="0.1" min="0" data-freezer-id="' + i.id + '" data-freezer-field="currentQty" value="' + (i.currentQty || 0) + '" style="width:52px;border:1px solid var(--line);border-radius:6px;padding:3px 4px;text-align:center;font-size:13px">' +
          '</span>' +
          '<span style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-soft)">' +
          'קונים בד"כ: <input type="number" step="0.1" min="0" data-freezer-id="' + i.id + '" data-freezer-field="usualQty" value="' + (i.usualQty || 0) + '" style="width:52px;border:1px solid var(--line);border-radius:6px;padding:3px 4px;text-align:center;font-size:13px">' +
          '</span>' +
          '<span style="font-size:11px;color:var(--ink-soft)">' + unitLabel + '</span>' +
          (missing > 0 ? '<span class="rf-badge" style="background:var(--terracotta)22;color:var(--terracotta)">חסר ' + formatQty(missing) + '</span>' : '<span class="rf-badge" style="background:var(--forest-soft);color:var(--forest)">מלא</span>') +
          '<span data-freezer-del="' + i.id + '" style="cursor:pointer;color:var(--ink-soft);padding:2px">✕</span>' +
          '</div>'
        );
      }).join("");

      return (
        '<h4 class="rf-title" style="font-size:15px;margin:18px 0 6px">' + cat.icon + ' ' + cat.label + '</h4>' +
        (rows
          ? '<div class="rf-card" style="padding:2px 14px">' + rows + '</div>'
          : '<p style="font-size:13px;color:var(--ink-soft);margin:0">עדיין לא הוספתם פריטים כאן</p>')
      );
    }).join("");

    var addForm = state.freezerFormOpen ? (
      '<div class="rf-card" style="padding:14px;margin-top:10px">' +
      '<span class="rf-label">שם הפריט</span>' +
      '<div style="position:relative;margin-bottom:10px">' +
      '<input id="rf-fz-name" class="rf-input" placeholder="למשל: בשר טחון" />' +
      '<div id="rf-fz-name-suggest"></div>' +
      '</div>' +
      '<span class="rf-label">סוג</span>' +
      '<div style="display:flex;gap:8px;margin-bottom:10px">' +
      FREEZER_CATS.map(function (c) { return '<label class="rf-chip"><input type="radio" name="rf-fz-cat" value="' + c.key + '" style="display:none">' + c.icon + ' ' + c.label + '</label>'; }).join("") +
      '</div>' +
      '<span class="rf-label">יחידת מידה</span>' +
      '<div style="display:flex;gap:8px;margin-bottom:10px">' +
      FREEZER_UNITS.map(function (u) { return '<label class="rf-chip"><input type="radio" name="rf-fz-unit" value="' + u.key + '" style="display:none">' + u.label + '</label>'; }).join("") +
      '</div>' +
      '<span class="rf-label">כמה יש כרגע</span>' +
      '<input id="rf-fz-current" type="number" step="0.1" min="0" class="rf-input" style="margin-bottom:10px" placeholder="0" />' +
      '<span class="rf-label">כמה קונים בדרך כלל</span>' +
      '<input id="rf-fz-usual" type="number" step="0.1" min="0" class="rf-input" style="margin-bottom:14px" placeholder="0" />' +
      '<div style="display:flex;gap:8px">' +
      '<button type="button" id="rf-fz-save" class="rf-btn">שמירה</button>' +
      '<button type="button" id="rf-fz-cancel" class="rf-btn-outline rf-btn">ביטול</button>' +
      '</div></div>'
    ) : '';

    var hasMissing = state.freezerItems.some(function (i) { return missingAmount(i) > 0; });

    return (
      '<button type="button" id="rf-fz-add-toggle" class="rf-details-link" style="width:100%;justify-content:center;padding:11px">' +
      (state.freezerFormOpen ? "✕ סגירה" : "+ הוספת פריט למקפיא") + '</button>' +
      addForm +
      sectionsHtml +
      (hasMissing ? '<button type="button" id="rf-fz-add-shop" class="rf-btn" style="width:100%;justify-content:center;margin-top:18px">🛒 הוספת חוסרים לרשימת הקניות</button>' : '') +
      '<div id="rf-fz-picker"></div>'
    );
  }

  function wireFreezer() {
    var toggle = document.getElementById("rf-fz-add-toggle");
    if (toggle) toggle.addEventListener("click", function () { state.freezerFormOpen = !state.freezerFormOpen; render(); });

    root.querySelectorAll('input[name="rf-fz-cat"], input[name="rf-fz-unit"]').forEach(function (inp) {
      inp.addEventListener("change", function () {
        root.querySelectorAll('input[name="' + inp.name + '"]').forEach(function (o) { o.closest("label").classList.remove("on"); });
        inp.closest("label").classList.add("on");
      });
    });

    var fzNameInput = document.getElementById("rf-fz-name");
    if (fzNameInput) {
      fzNameInput.addEventListener("input", function () {
        var box = document.getElementById("rf-fz-name-suggest");
        var val = fzNameInput.value.trim();
        if (!val) { box.innerHTML = ""; return; }
        var opts = allIngredients().filter(function (i) { return i.indexOf(val) !== -1; }).slice(0, 6);
        if (opts.length === 0) { box.innerHTML = ""; return; }
        box.innerHTML = '<div class="rf-suggest">' + opts.map(function (o) { return '<button type="button" data-fz-pick="' + esc(o) + '">' + esc(o) + '</button>'; }).join("") + '</div>';
        box.querySelectorAll("[data-fz-pick]").forEach(function (b) {
          b.addEventListener("mousedown", function () {
            fzNameInput.value = b.getAttribute("data-fz-pick");
            box.innerHTML = "";
          });
        });
      });
      fzNameInput.addEventListener("blur", function () { setTimeout(function () { var b = document.getElementById("rf-fz-name-suggest"); if (b) b.innerHTML = ""; }, 150); });
    }

    var saveBtn = document.getElementById("rf-fz-save");
    if (saveBtn) saveBtn.addEventListener("click", function () {
      var name = document.getElementById("rf-fz-name").value.trim();
      var cat = root.querySelector('input[name="rf-fz-cat"]:checked');
      var unit = root.querySelector('input[name="rf-fz-unit"]:checked');
      var current = parseFloat(document.getElementById("rf-fz-current").value) || 0;
      var usual = parseFloat(document.getElementById("rf-fz-usual").value) || 0;
      if (!name || !cat || !unit) { alert("צריך שם, סוג ויחידת מידה"); return; }
      addFreezerItem({ name: name, category: cat.value, unit: unit.value, currentQty: current, usualQty: usual });
      state.freezerFormOpen = false;
      render();
    });
    var cancelBtn = document.getElementById("rf-fz-cancel");
    if (cancelBtn) cancelBtn.addEventListener("click", function () { state.freezerFormOpen = false; render(); });

    root.querySelectorAll("[data-freezer-id]").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var val = parseFloat(inp.value) || 0;
        updateFreezerQty(inp.getAttribute("data-freezer-id"), inp.getAttribute("data-freezer-field"), val);
      });
    });
    root.querySelectorAll("[data-freezer-del]").forEach(function (el) {
      el.addEventListener("click", function () {
        if (confirm("להסיר את הפריט מהמקפיא?")) deleteFreezerItem(el.getAttribute("data-freezer-del"));
      });
    });

    var addShopBtn = document.getElementById("rf-fz-add-shop");
    if (addShopBtn) addShopBtn.addEventListener("click", function () {
      var box = document.getElementById("rf-fz-picker");
      if (box.getAttribute("data-open") === "1") { box.innerHTML = ""; box.removeAttribute("data-open"); return; }
      var missingItems = state.freezerItems.filter(function (i) { return missingAmount(i) > 0; });
      box.innerHTML =
        '<div class="rf-card" style="padding:12px;margin-top:10px">' +
        missingItems.map(function (i) {
          var label = esc(i.name) + " — " + formatQty(missingAmount(i)) + " " + freezerUnitLabel(i.unit);
          return '<label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px">' +
            '<input type="checkbox" class="rf-fz-pick-cb" data-name="' + esc(i.name) + '" data-category="' + esc(i.category) + '" style="width:18px;height:18px;flex-shrink:0">' + label + '</label>';
        }).join("") +
        '<button type="button" id="rf-fz-pick-confirm" class="rf-btn" style="margin-top:10px;width:100%;justify-content:center">הוספת הנבחרים</button>' +
        '</div>';
      box.setAttribute("data-open", "1");
      document.getElementById("rf-fz-pick-confirm").addEventListener("click", function () {
        var chosen = Array.prototype.slice.call(box.querySelectorAll(".rf-fz-pick-cb:checked")).map(function (cb) {
          return { name: cb.getAttribute("data-name"), category: cb.getAttribute("data-category") };
        });
        if (chosen.length) addShoppingItems(chosen);
        box.innerHTML = ""; box.removeAttribute("data-open");
        addShopBtn.textContent = "✓ נוסף לרשימת הקניות";
        setTimeout(function () { if (addShopBtn) addShopBtn.textContent = "🛒 הוספת חוסרים לרשימת הקניות"; }, 1800);
      });
    });
  }

  function render() {
    if (connStatus === "error") {
      root.innerHTML =
        '<div style="padding:20px 0"><h1 class="rf-title" style="font-size:22px">המתכונים של אמא</h1>' +
        '<p class="rf-status" style="color:var(--brick)">החיבור ל-Firebase נכשל: ' + esc(connErrorMsg) + '</p></div>';
      return;
    }
    var body;
    if (state.tab === "shopping") {
      body = state.shoppingLoading ? '<p style="color:var(--ink-soft)">טוען...</p>' : renderShopping();
    } else if (state.tab === "freezer") {
      body = state.freezerLoading ? '<p style="color:var(--ink-soft)">טוען...</p>' : renderFreezer();
    } else if (state.loading) {
      body = '<p style="color:var(--ink-soft)">טוען...</p>';
    } else if (state.view === "form") {
      body = renderForm();
    } else if (state.view === "detail") {
      body = renderDetail();
    } else {
      body = renderList();
    }
    root.innerHTML =
      '<header style="margin-bottom:18px;text-align:center">' +
      '<div style="font-size:34px;margin-bottom:4px">🍲</div>' +
      '<h1 class="rf-title" style="font-size:25px;margin:0;color:var(--forest)">המתכונים של אמא</h1>' +
      '<div style="color:var(--terracotta);font-size:13px;margin:2px 0">⟿ ♡ ⟿</div>' +
      '<p style="color:var(--ink-soft);font-size:13px;margin:2px 0 0">מה מבשלים היום?</p>' +
      '</header>' +
      renderTabs() + body;

    root.querySelectorAll("[data-tab]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.tab = btn.getAttribute("data-tab");
        render();
      });
    });

    if (state.tab === "shopping") { wireShopping(); return; }
    if (state.tab === "freezer") { wireFreezer(); return; }
    if (state.view === "form") { renderImageWrap(); wireForm(); }
    if (state.view === "list") wireList();
    if (state.view === "detail") wireDetail();
  }

  // ---------- Wiring ----------
  function wireList() {
    var search = document.getElementById("rf-search");
    if (search) {
      search.addEventListener("input", function () {
        state.query = search.value;
        renderSearchSuggest();
        updateResults();
      });
      search.addEventListener("blur", function () { setTimeout(function () { var s = document.getElementById("rf-search-suggest"); if (s) s.innerHTML = ""; }, 150); });
    }
    root.querySelectorAll("[data-cat]").forEach(function (btn) {
      btn.addEventListener("click", function () { toggleCategory(btn.getAttribute("data-cat")); });
    });
    var freezerOnly = document.getElementById("rf-freezer-only");
    if (freezerOnly) freezerOnly.addEventListener("change", function () {
      state.freezerOnly = freezerOnly.checked;
      render();
    });
    wireResultCards();
    var fab = document.getElementById("rf-fab");
    if (fab) fab.addEventListener("click", openNewForm);
    var randomBtn = document.getElementById("rf-random");
    if (randomBtn) randomBtn.addEventListener("click", openRandomRecipe);
  }

  function renderSearchSuggest() {
    var box = document.getElementById("rf-search-suggest");
    if (!box) return;
    var parts = state.query.split(",");
    var last = parts[parts.length - 1].trim();
    if (!last) { box.innerHTML = ""; return; }
    var already = parts.slice(0, -1).map(function (t) { return t.trim(); });
    var opts = allIngredients().filter(function (i) { return i.indexOf(last) !== -1 && already.indexOf(i) === -1; }).slice(0, 6);
    if (opts.length === 0) { box.innerHTML = ""; return; }
    box.innerHTML = '<div class="rf-suggest" style="position:relative">' + opts.map(function (o) {
      return '<button type="button" data-pick="' + esc(o) + '">' + esc(o) + '</button>';
    }).join("") + '</div>';
    box.querySelectorAll("[data-pick]").forEach(function (b) {
      b.addEventListener("mousedown", function () {
        var parts2 = state.query.split(",");
        parts2[parts2.length - 1] = " " + b.getAttribute("data-pick");
        state.query = parts2.map(function (p) { return p.trim(); }).join(", ") + ", ";
        render();
        var s = document.getElementById("rf-search"); if (s) { s.focus(); s.value = state.query; }
      });
    });
  }

  function wireDetail() {
    var back = document.getElementById("rf-back"); if (back) back.addEventListener("click", backToList);
    var edit = document.getElementById("rf-edit"); if (edit) edit.addEventListener("click", function () { openEditForm(state.activeId); });
    var del = document.getElementById("rf-delete");
    if (del) del.addEventListener("click", function () {
      if (confirm("למחוק את המתכון?")) deleteRecipe(state.activeId);
    });
    var addShop = document.getElementById("rf-add-shop");
    if (addShop) addShop.addEventListener("click", function () {
      var box = document.getElementById("rf-shop-picker");
      if (box.getAttribute("data-open") === "1") {
        box.innerHTML = ""; box.removeAttribute("data-open");
        return;
      }
      var r = state.recipes.find(function (x) { return x.id === state.activeId; });
      if (!r) return;
      var allNames = [];
      r.ingredients.forEach(function (entry) { ingredientNames(entry).forEach(function (n) { allNames.push(n); }); });
      box.innerHTML =
        '<div class="rf-card" style="padding:12px;margin-top:10px">' +
        allNames.map(function (ing) {
          return '<label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px">' +
            '<input type="checkbox" class="rf-shop-pick-cb" value="' + esc(ing) + '" style="width:18px;height:18px;flex-shrink:0">' +
            esc(ing) + '</label>';
        }).join("") +
        '<button type="button" id="rf-shop-pick-confirm" class="rf-btn" style="margin-top:10px;width:100%;justify-content:center">הוספת הנבחרים</button>' +
        '</div>';
      box.setAttribute("data-open", "1");
      document.getElementById("rf-shop-pick-confirm").addEventListener("click", function () {
        var chosen = Array.prototype.slice.call(box.querySelectorAll(".rf-shop-pick-cb:checked")).map(function (cb) { return cb.value; });
        if (chosen.length) addShoppingItems(chosen);
        box.innerHTML = ""; box.removeAttribute("data-open");
        addShop.textContent = "✓ נוסף לרשימת הקניות";
        setTimeout(function () { if (addShop) addShop.textContent = "🛒 הוספה לרשימת הקניות"; }, 1800);
      });
    });
  }

  function wireForm() {
    root.querySelectorAll('input[name="rf-time"], input[name="rf-main"]').forEach(function (inp) {
      inp.addEventListener("change", function () {
        var group = inp.name;
        root.querySelectorAll('input[name="' + group + '"]').forEach(function (o) { o.closest("label").classList.remove("on"); });
        inp.closest("label").classList.add("on");
      });
    });

    var ingInput = document.getElementById("rf-ing-input");
    function ingredientExists(v) {
      return state.formIngredients.some(function (entry) { return ingredientNames(entry).indexOf(v) !== -1; });
    }
    function addIngredient(v) {
      v = v.trim();
      if (!v || ingredientExists(v)) { ingInput.value = ""; return; }
      var orToggle = document.getElementById("rf-ing-or");
      if (orToggle && orToggle.checked && state.formIngredients.length > 0) {
        var lastIdx = state.formIngredients.length - 1;
        var last = state.formIngredients[lastIdx];
        state.formIngredients[lastIdx] = isOrGroup(last) ? { or: last.or.concat([v]) } : { or: [last, v] };
      } else {
        state.formIngredients.push(v);
      }
      ingInput.value = "";
      document.getElementById("rf-ing-chips").innerHTML = renderIngredientChips();
      wireIngredientChips();
      document.getElementById("rf-ing-suggest").innerHTML = "";
    }
    function wireIngredientChips() {
      root.querySelectorAll("[data-remove-idx]").forEach(function (x) {
        x.addEventListener("click", function () {
          var idx = parseInt(x.getAttribute("data-remove-idx"), 10);
          state.formIngredients.splice(idx, 1);
          document.getElementById("rf-ing-chips").innerHTML = renderIngredientChips();
          wireIngredientChips();
        });
      });
      root.querySelectorAll("[data-move-up-idx]").forEach(function (x) {
        x.addEventListener("click", function () {
          var idx = parseInt(x.getAttribute("data-move-up-idx"), 10);
          if (idx <= 0) return;
          var arr = state.formIngredients;
          var tmp = arr[idx - 1]; arr[idx - 1] = arr[idx]; arr[idx] = tmp;
          document.getElementById("rf-ing-chips").innerHTML = renderIngredientChips();
          wireIngredientChips();
        });
      });
    }
    wireIngredientChips();

    if (ingInput) {
      ingInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); addIngredient(ingInput.value); }
      });
      ingInput.addEventListener("input", function () {
        // Split on every comma the moment it appears — handles typing, mobile
        // keyboards, and pasted comma-separated lists alike (keydown alone is
        // unreliable for punctuation on many mobile keyboards).
        if (ingInput.value.indexOf(",") !== -1) {
          var parts = ingInput.value.split(",");
          var remainder = parts.pop();
          parts.forEach(function (p) { addIngredient(p); });
          ingInput.value = remainder.replace(/^\s+/, "");
        }

        var box = document.getElementById("rf-ing-suggest");
        var val = ingInput.value.trim();
        if (!val) { box.innerHTML = ""; return; }
        var opts = allIngredients().filter(function (i) { return i.indexOf(val) !== -1 && !ingredientExists(i); }).slice(0, 6);
        if (opts.length === 0) { box.innerHTML = ""; return; }
        box.innerHTML = '<div class="rf-suggest">' + opts.map(function (o) { return '<button type="button" data-add="' + esc(o) + '">' + esc(o) + '</button>'; }).join("") + '</div>';
        box.querySelectorAll("[data-add]").forEach(function (b) {
          b.addEventListener("mousedown", function () { addIngredient(b.getAttribute("data-add")); });
        });
      });
      ingInput.addEventListener("blur", function () { setTimeout(function () { var b = document.getElementById("rf-ing-suggest"); if (b) b.innerHTML = ""; }, 150); });
    }

    wireImageControls();

    var saveBtn = document.getElementById("rf-save"); if (saveBtn) saveBtn.addEventListener("click", saveRecipeFromForm);
    var cancelBtn = document.getElementById("rf-cancel"); if (cancelBtn) cancelBtn.addEventListener("click", backToList);
  }

  function wireImageControls() {
    var input = document.getElementById("rf-img-input");
    if (input) {
      input.addEventListener("change", function () {
        var file = input.files && input.files[0];
        if (!file) return;
        state.formImgBusy = true;
        renderImageWrap();
        resizeImage(file).then(function (dataUrl) {
          state.formImage = dataUrl;
          state.formImgBusy = false;
          renderImageWrap();
          wireImageControls();
        }).catch(function () {
          state.formImgBusy = false;
          renderImageWrap();
          wireImageControls();
        });
      });
    }
    var removeBtn = document.getElementById("rf-img-remove");
    if (removeBtn) removeBtn.addEventListener("click", function () {
      state.formImage = "";
      renderImageWrap();
      wireImageControls();
    });
  }

  render();
})();
</script>
</body>
</html>
